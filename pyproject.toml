[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-lineage"
version = "0.1.0"
description = "Document lineage: identity, extraction with page pointers, and version and family comparison for recurring investment documents"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "jsonschema==4.22.0",
    "pypdf==6.0.0",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "pillow==11.3.0",
    "python-redlines[docxodus]==0.3.0",
]

[project.optional-dependencies]
ocr = [
    "pypdfium2==4.30.0",
    "pytesseract==0.3.13",
]
harvest = [
    "edgartools>=4.0.0",
]
dev = [
    "setuptools==82.0.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.7",
    "mypy==2.3.1",
    "types-jsonschema==4.23.0.20241208",
    "black==26.5.1",
    "pypdf==6.0.0",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "pillow==11.3.0",
    "reportlab==4.4.2",
]

[project.scripts]
doc-lineage = "doc_lineage.cli:main"

[project.urls]
Homepage = "https://github.com/stranske/Template"
Repository = "https://github.com/stranske/Template"

[project.entry-points."console_scripts"]
doc-lineage = "doc_lineage.cli:main"

[tool.setuptools]
packages = [
    "doc_lineage",
    "doc_lineage._contracts",
    "doc_lineage._vocab",
    "doc_lineage.adapters",
    "doc_lineage.compare",
    "doc_lineage.extract",
    "doc_lineage.lineage",
    "doc_lineage.mutations",
    "doc_lineage.harvest",
    "doc_lineage.schema",
]
package-dir = {"" = "src", "doc_lineage._vocab" = "vocab", "doc_lineage._contracts" = "docs/contracts/schemas"}

[tool.setuptools.package-data]
"doc_lineage._contracts" = ["*.schema.json"]
"doc_lineage._vocab" = ["legal-clauses.json"]
"doc_lineage.compare" = ["data/*.json"]
"doc_lineage.schema" = ["schemas/*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=xml"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["doc_lineage", "tools"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "python_redlines.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Optional OCR dependencies ship no type information. They are imported lazily
# behind ImportError handling, so the untyped import is deliberate.
[[tool.mypy.overrides]]
module = ["pypdfium2", "pytesseract", "edgar", "edgartools"]
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py312"]
